<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#d9d9d9"/>

  <!-- cramped black header -->
  <rect width="800" height="90" fill="#0a0a0a"/>
  <text x="24" y="40" font-family="Arial Black, Arial" font-size="26" font-weight="900" fill="#ff2b2b" stroke="#ffffff" stroke-width="0.6">REDLINE AUTO DETAIL</text>
  <text x="24" y="62" font-family="Arial" font-size="12" fill="#cccccc" font-style="italic">Making your ride shine since 2011</text>
  <text x="24" y="80" font-family="Arial" font-size="11" fill="#ffcc00">CALL OR TEXT: (555) 555-0199</text>

  <!-- basic nav -->
  <rect x="0" y="90" width="800" height="28" fill="#1c1c1c"/>
  <text x="20" y="109" font-family="Arial" font-size="12" fill="#ffffff">Home</text>
  <text x="80" y="109" font-family="Arial" font-size="12" fill="#ffffff">Services</text>
  <text x="160" y="109" font-family="Arial" font-size="12" fill="#ffffff">Gallery</text>
  <text x="230" y="109" font-family="Arial" font-size="12" fill="#ffffff">About</text>
  <text x="300" y="109" font-family="Arial" font-size="12" fill="#ffffff">Contact</text>

  <!-- small grainy photo -->
  <rect x="0" y="118" width="800" height="180" fill="#3a3a3a"/>
  <rect x="250" y="150" width="300" height="120" fill="#555555"/>
  <text x="400" y="215" font-family="Arial" font-size="12" fill="#999999" text-anchor="middle">car-photo-small.jpg (low res)</text>
  <rect x="0" y="118" width="800" height="180" fill="none" stroke="#222" stroke-width="4"/>

  <!-- dense unstructured service text -->
  <rect x="0" y="298" width="800" height="220" fill="#e8e8e8"/>
  <text x="24" y="328" font-family="Times New Roman, serif" font-size="15" font-weight="700" fill="#111">Our Services</text>
  <text x="24" y="352" font-family="Times New Roman, serif" font-size="12" fill="#222">Full interior detail, exterior wash and wax, clay bar treatment, engine bay cleaning,</text>
  <text x="24" y="368" font-family="Times New Roman, serif" font-size="12" fill="#222">headlight restoration, ceramic coating, paint correction, upholstery shampoo, leather</text>
  <text x="24" y="384" font-family="Times New Roman, serif" font-size="12" fill="#222">conditioning, odor removal, pet hair removal, and mobile detailing available upon request.</text>
  <text x="24" y="400" font-family="Times New Roman, serif" font-size="12" fill="#222">Prices vary depending on vehicle size and condition. Call for a quote - we do not list prices</text>
  <text x="24" y="416" font-family="Times New Roman, serif" font-size="12" fill="#222">online. Walk-ins welcome but appointments preferred. Cash or check only at this time.</text>

  <text x="24" y="452" font-family="Times New Roman, serif" font-size="12" fill="#222" font-weight="700">Hours:</text>
  <text x="24" y="470" font-family="Times New Roman, serif" font-size="11" fill="#333">Mon-Fri 8-6, Sat 9-3, Closed Sunday (hours may vary, please call ahead)</text>

  <rect x="24" y="490" width="200" height="18" fill="#ffcc00"/>
  <text x="30" y="503" font-family="Arial" font-size="10" fill="#7a0000" font-weight="700">UNDER CONSTRUCTION - CHECK BACK SOON</text>

  <rect x="0" y="576" width="800" height="24" fill="#0a0a0a"/>
  <text x="400" y="592" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">&#169; Redline Auto Detail. Site last updated 2015.</text>
</svg>
