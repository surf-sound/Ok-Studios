  <text x="170" y="142" font-family="Arial" font-size="13" fill="#ffe28a">OUR SERVICES</text>
  <text x="290" y="142" font-family="Arial" font-size="13" fill="#ffe28a">GALLERY</text>
  <text x="370" y="142" font-family="Arial" font-size="13" fill="#ffe28a">TESTIMONIALS</text>
  <text x="500" y="142" font-family="Arial" font-size="13" fill="#ffe28a">CONTACT US</text>
  <text x="620" y="142" font-family="Arial" font-size="13" fill="#ffffff" font-weight="700">CALL NOW: 555-0142</text>

  <!-- marquee-ish banner -->
