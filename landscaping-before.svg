  <text x="692" y="528" font-family="Courier New" font-size="16" fill="#c00" text-anchor="middle" font-weight="700">004821</text>

  <rect x="0" y="576" width="800" height="24" fill="#1a2e1a"/>
  <text x="400" y="592" font-family="Arial" font-size="10" fill="#8a9e78" text-anchor="middle">Copyright 2009 Smith's Landscaping. Best viewed in Internet Explorer.</text>
