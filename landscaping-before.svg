  <text x="34" y="508" font-family="Times New Roman, serif" font-size="11" fill="#333">Phone: (555) 555-0142 (leave a message)</text>
  <text x="34" y="524" font-family="Times New Roman, serif" font-size="11" fill="#333">Email: smithslandscaping1994@some-provider.net</text>
  <text x="34" y="540" font-family="Times New Roman, serif" font-size="11" fill="#333">Hours: Mon-Fri 7am-5pm, Sat by appointment</text>

