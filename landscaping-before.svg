  <circle cx="700" cy="230" r="34" fill="#5c8a4a"/>
  <rect x="694" y="258" width="12" height="26" fill="#7a5230"/>
  <circle cx="650" cy="245" r="24" fill="#6f9b57"/>
  <rect x="646" y="264" width="8" height="18" fill="#7a5230"/>

