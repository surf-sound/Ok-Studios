  <text x="400" y="172" font-family="Arial Black, Arial" font-size="14" font-weight="900" fill="#7a0000" text-anchor="middle">*** SPRING SPECIAL - 10% OFF ALL SERVICES - CALL TODAY! ***</text>

  <!-- cramped body text block -->
  <rect x="0" y="180" width="800" height="420" fill="#f2efe2"/>
  <text x="24" y="215" font-family="Times New Roman, serif" font-size="15" fill="#222" font-weight="700">Welcome to Smith's Landscaping!</text>
  <text x="24" y="238" font-family="Times New Roman, serif" font-size="12" fill="#333">We provide lawn mowing, edging, trimming, mulching, tree removal, sprinkler repair, leaf</text>
  <text x="24" y="254" font-family="Times New Roman, serif" font-size="12" fill="#333">removal, fertilization, weed control, landscape design, retaining walls, sod installation,</text>
  <text x="24" y="270" font-family="Times New Roman, serif" font-size="12" fill="#333">seasonal cleanup, snow removal and much more! We have been serving homeowners and</text>
  <text x="24" y="286" font-family="Times New Roman, serif" font-size="12" fill="#333">businesses in the area for over 30 years with quality work at a fair price. Call or email us</text>
  <text x="24" y="302" font-family="Times New Roman, serif" font-size="12" fill="#333">today for a free estimate! We are licensed and insured. No job too big or too small.</text>

