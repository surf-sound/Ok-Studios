  <text x="304" y="395" font-family="Arial" font-size="10" fill="#3a3a3a" text-anchor="middle">photo2.jpg</text>
  <text x="494" y="395" font-family="Arial" font-size="10" fill="#3a3a3a" text-anchor="middle">photo3.jpg</text>

