  <text x="24" y="45" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#1a3a1a" stroke="#ffffff" stroke-width="0.5">Smith's Landscaping &amp; Lawn Care</text>
  <text x="24" y="72" font-family="Arial" font-size="13" fill="#0d2b0d" font-style="italic">"Serving the area since 1994" - Family Owned</text>

  <!-- nav bar, cluttered -->
  <rect x="0" y="120" width="800" height="34" fill="#2f5233"/>
  <text x="16" y="142" font-family="Arial" font-size="13" fill="#ffe28a">HOME</text>
